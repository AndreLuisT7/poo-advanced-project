# os testes rodam em banco proprio, em memoria, sem depender do Postgres nem de credencial
spring.profiles.active=
spring.datasource.url=jdbc:h2:mem:teste
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=teste
spring.mail.password=teste
vonage.api.key=teste
vonage.api.secret=teste
spring.main.allow-bean-definition-overriding=true
