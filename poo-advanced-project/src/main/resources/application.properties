spring.application.name=poo-advanced-project

# Nenhuma credencial fica neste arquivo, que vai para o repositorio.
# Defina as variaveis de ambiente abaixo, ou coloque os valores em
# application-local.properties, que esta no .gitignore.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
vonage.api.key=${VONAGE_API_KEY:}
vonage.api.secret=${VONAGE_API_SECRET:}
# conexao do banco fica no application-local.properties, que nao vai pro git
spring.profiles.active=local
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
