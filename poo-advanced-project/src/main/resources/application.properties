spring.application.name=poo-advanced-project

# Nenhuma credencial fica neste arquivo, que vai para o repositorio.
#
# Para preencher, escolha UM dos dois caminhos:
#   1. copie application-secrets.properties.example para
#      application-secrets.properties e preencha (vale para qualquer perfil);
#   2. ou defina as variaveis de ambiente MAIL_USERNAME, MAIL_PASSWORD,
#      VONAGE_API_KEY e VONAGE_API_SECRET.
#
# O arquivo de segredos esta no .gitignore e nunca deve ser versionado.
spring.config.import=optional:classpath:application-secrets.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
vonage.api.key=${VONAGE_API_KEY:}
vonage.api.secret=${VONAGE_API_SECRET:}
# conexao do banco fica no application-local.properties, que nao vai pro git
spring.profiles.active=local
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
